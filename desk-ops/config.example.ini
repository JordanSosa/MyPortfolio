; Copy this file to config.ini (python3 desk.py init does it for you) and fill it in.
; config.ini is ignored by git, so your details and password never reach GitHub.

[sender]
; Every outreach email carries these details. The Spam Act requires them to be
; accurate, so live sending is blocked while any value still holds a [placeholder].
name = [Your name]
business = [Business name]
abn = [ABN]
email = [desk email address]
phone = [phone]
location = Macarthur, NSW
agent_number = [ASIC agent number]
; A free Cal.com, Calendly or Google Calendar booking page for 15-minute calls.
booking_link = [booking link]

[offer]
; Dollars per company per year, excluding GST. Used in emails and proposals.
desk_fee = 140
founding_discount = 15%
; Fixed fees for work outside the desk fee, each + GST + the ASIC fee.
share_change_fee = 95
special_resolution_fee = 150
new_company_fee = 220
deregistration_fee = 140

[mail]
; Google Workspace or Gmail is the tested setup. Use an app password
; (Google Account > Security > 2-Step Verification > App passwords).
; Microsoft 365 mailboxes won't work: Microsoft requires OAuth for IMAP.
username = [desk email address]
; Leave blank and set the DESK_MAIL_PASSWORD environment variable instead, if you prefer.
password =
smtp_host = smtp.gmail.com
smtp_port = 587
imap_host = imap.gmail.com
imap_port = 993
inbox_folder = INBOX
drafts_folder = [Gmail]/Drafts
; Gmail files sent mail by itself, so leave this blank. Most other providers: Sent
sent_folder =

[outreach]
; Small, personal batches. Bulk volume hurts deliverability and reads as spam.
daily_limit = 15
; One follow-up, four business days after the first email, then stop.
followup_after_business_days = 4
max_emails_per_firm = 2
; Random pause between sends, in seconds.
min_delay_seconds = 45
max_delay_seconds = 120
; Live sends only happen inside this window on business days (local time).
send_window = 08:30-15:30
; NSW public holidays. Check nsw.gov.au and extend each year.
holidays = 2026-12-25, 2026-12-28, 2027-01-01, 2027-01-26, 2027-03-26, 2027-03-29,
    2027-06-14, 2027-10-04, 2027-12-27, 2027-12-28
; No outreach while firms are shut over Christmas. Format: start..end
quiet_periods = 2026-12-19..2027-01-10

[ai]
; Optional. When on, replies to prospects and general enquiries are drafted by
; Claude from knowledge/faq.md. Change requests never go to the API.
; Needs: pip install anthropic, Python 3.10+, and ANTHROPIC_API_KEY set.
enabled = false
model = claude-opus-5-5
; low suits short emails; raise to medium if drafts miss the point.
effort = low
