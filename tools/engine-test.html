<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2d1b45" />
    <title>Engine Test - Kira Kira Overdrive</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2d1b45;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #hint {
        position: fixed;
        right: calc(8px + env(safe-area-inset-right, 0px));
        top: calc(8px + env(safe-area-inset-top, 0px));
        font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
        color: #e9e3f7;
        background: rgba(20, 12, 34, 0.6);
        border: 1px solid rgba(180, 124, 255, 0.45);
        border-radius: 6px;
        padding: 4px 7px;
        pointer-events: none;
        white-space: pre;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div id="hint"></div>
    <script type="module" src="./engine-test.ts"></script>
