<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sprite Preview</title>
    <style>
      body { margin: 0; background: #241838; color: #e9e3f7; font: 12px/1.3 monospace; }
      #errors { white-space: pre-wrap; color: #ff8fab; padding: 8px; }
      #grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; align-items: flex-start; }
      .cell { background: #31244d; border: 1px solid #4b3470; padding: 6px; border-radius: 4px; }
      .cell.missing { border-color: #ff4d6d; }
      .label { margin-bottom: 4px; color: #ddc6ff; }
      .label b { color: #fff7b0; }
      canvas { image-rendering: pixelated; display: block; }
      .frames { display: flex; gap: 4px; }
    </style>
  </head>
  <body>
    <div id="errors"></div>
    <div id="grid"></div>
    <script type="module" src="./sprites.ts"></script>
  </body>
</html>
