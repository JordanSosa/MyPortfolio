name: cryptobot forward test (paper)

# Runs the frozen strategy once a day on Binance's public archive (the same
# data the backtest used) and commits the paper ledger, building an
# unfalsifiable, timestamped forward-test record. Paper only: no keys, no orders.
on:
  schedule:
    - cron: "17 3 * * *"   # daily archive files are published a few hours after 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cryptobot-forward-test
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: cryptobot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: cryptobot/data
          key: cryptobot-data-${{ github.run_id }}
          restore-keys: cryptobot-data-
      - name: Paper trade (v4 ensemble - the recommended strategy)
        run: python scripts/paper_trade.py --exchange binance-archive --strategy frozen_config_v4.json
      - name: Paper trade (v3 - kept running for comparison)
        run: python scripts/paper_trade.py --exchange binance-archive --strategy frozen_config.json
      - name: Forward vs backtest reports
        run: |
          python scripts/forward_report.py reports/paper/binance-archive-v4 | tee reports/paper/binance-archive-v4/latest_report.json
          python scripts/forward_report.py reports/paper/binance-archive-v3 | tee reports/paper/binance-archive-v3/latest_report.json
      - name: Raise an issue if a kill switch fired
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in v4 v3; do
            f=reports/paper/binance-archive-$v/latest_report.json
            if [ -f "$f" ] && grep -q '"STOP TRADING' "$f"; then
              gh issue create --title "cryptobot $v: kill switch fired ($(date -u +%F))" \
                --body "forward_report.py returned STOP for the $v paper ledger. Stop live trading of $v and re-validate. Report: \`cryptobot/$f\`" || true
            fi
          done
      - name: Commit ledgers
        run: |
          git config user.name "cryptobot-forward-test"
          git config user.email "actions@users.noreply.github.com"
          git add reports/paper/binance-archive-v4 reports/paper/binance-archive-v3
          git diff --cached --quiet || git commit -m "cryptobot: forward-test ledger $(date -u +%F)"
          git push
