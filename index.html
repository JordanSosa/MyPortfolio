<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2d1b45" />
    <meta name="description" content="Kira Kira Overdrive - a cute, chaotic anime pixel-art survivors-like. Survive the nightmare plushie stampede until dawn!" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kira Kira" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Kira Kira Overdrive</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #140c22;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* static boot splash: painted before any script runs, removed by src/main.ts once the app starts */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4vmin;
        background: radial-gradient(ellipse at 50% 35%, #4b3470 0%, #2d1b45 45%, #140c22 100%);
        color: #fff;
        font: 700 clamp(26px, 12vmin, 80px) / 1 "Pixelify Sans", ui-rounded, system-ui, sans-serif;
        text-align: center;
        text-shadow: 0 3px 0 #2d1b45, 0 0 24px rgba(255, 122, 184, 0.8);
      }
      #boot b {
        display: block;
        font-size: 1.3em;
        color: #ffe14d;
        text-shadow: 0 4px 0 #2d1b45, 0 0 24px rgba(255, 154, 61, 0.7);
      }
      #boot small {
        font: 400 clamp(12px, 3.4vmin, 20px) / 1 ui-monospace, monospace;
        letter-spacing: 0.2em;
        color: #ddc6ff;
        text-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="boot"><div>KIRA☆KIRA<b>OVERDRIVE</b></div><small>loading…</small></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
